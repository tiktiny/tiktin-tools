<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>אפליקציה ראשית — משרד טיקטין</title>
<meta name="description" content="כל כלי התכנון של משרד טיקטין במקום אחד: כבלים, גנרטורים, חיבורי חשמל וחדרי מונים.">
<meta name="theme-color" content="#17364c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="icons/tiktin-192.png"><link rel="apple-touch-icon" href="icons/tiktin-180.png"><link rel="manifest" href="manifest.webmanifest?v=2">
<style>
:root{color-scheme:light;--ink:#17364c;--muted:#5b6b76;--red:#c8202f;--cu:#b06a2c;--cu2:#d99a5e;--steel:#e9eef1;--line:#d5dee3;--white:#fff}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--steel);color:var(--ink);font-family:Rubik,Arial,sans-serif;font-size:16px;line-height:1.45;display:flex;flex-direction:column;min-height:100dvh}
header{background:var(--white);border-bottom:3px solid var(--red);flex:0 0 auto}
.head{display:flex;align-items:center;gap:22px;padding:12px 28px}
.logo{width:126px;max-height:55px;object-fit:contain}
.brand{border-right:1px solid var(--line);padding-right:22px}
.brand h1{font-size:26px;font-weight:700;margin:0;line-height:1.25}
.brand p{margin:0;color:var(--muted);font-size:14px}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:20px 28px 22px}
.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.col{display:flex;flex-direction:column;gap:18px;min-height:0}
/* group = a busbar with its circuits */
.grp{flex:var(--n,1) 1 0;min-height:0;display:flex;flex-direction:column;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:14px 18px 16px 18px}
.grp h2{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;font-size:18px;font-weight:700}
.grp h2 small{font-size:13px;font-weight:400;color:var(--muted)}
.bus{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;position:relative;padding-right:22px}
.bus::before{content:"";position:absolute;right:0;top:4px;bottom:4px;width:6px;border-radius:3px;background:linear-gradient(90deg,var(--cu),var(--cu2),var(--cu))}
.tool{flex:1 1 0;min-height:58px;max-height:110px;position:relative;display:flex;align-items:center;gap:14px;padding:8px 14px;border:1px solid var(--line);border-radius:8px;color:inherit;text-decoration:none;background:var(--white)}
.tool::before{content:"";position:absolute;right:-23px;top:50%;width:22px;height:2px;background:var(--cu);transform:translateY(-50%)}
.tool::after{content:"";position:absolute;right:-6px;top:50%;width:9px;height:9px;border-radius:50%;background:var(--white);border:2px solid var(--cu);transform:translateY(-50%)}
.tool:hover{border-color:var(--ink);background:#f7fafb}
.tool:hover::after{background:var(--red);border-color:var(--red)}
.tool:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.icon{flex:0 0 auto;width:42px;height:42px;border-radius:9px;background:var(--steel);color:var(--ink);display:grid;place-items:center}
.icon svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon.pic{background:none;overflow:hidden}.icon img{width:42px;height:42px;border-radius:9px;display:block}
.txt{min-width:0;flex:1}
.tool h3{margin:0;font-size:16.5px;font-weight:700;line-height:1.3}
.tool p{margin:2px 0 0;font-size:13.5px;color:var(--muted);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ext{flex:0 0 auto;width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool:hover .ext{stroke:var(--red)}
.fz{display:flex;margin-inline-start:auto;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;flex:none}
.fz button{border:0;border-inline-start:1px solid var(--line);background:#fff;height:32px;min-width:34px;padding:0 10px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;white-space:nowrap}
.fz button:first-child{border-inline-start:0}
.fz button:hover{background:var(--steel)}
.fz .keep{color:var(--red);font-weight:500}
.fz button:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
#fzToast{position:fixed;left:16px;top:76px;background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
#fzToast.on{opacity:1}
body.zoomed main,body.zoomed .board,body.zoomed .grp,body.zoomed .bus{flex:none;min-height:auto}
body.zoomed .tool{flex:none;max-height:none;min-height:58px}body.zoomed .tool p{-webkit-line-clamp:3}
#pager{display:none}
@media(max-height:760px) and (min-width:700px){.tool p{-webkit-line-clamp:1}.grp{padding:10px 14px 12px}.grp h2{margin-bottom:6px;font-size:16px}}
@media(max-width:699px){
 .fz,#fzToast{display:none}
 .head{padding:10px 14px;gap:12px}.logo{width:86px;max-height:42px}.brand{padding-right:12px}.brand h1{font-size:20px}.brand p{font-size:12px}
 main{padding:12px 12px 10px}
 .board{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none}
 .board::-webkit-scrollbar{display:none}
 .col{display:contents}
 .grp{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always}
 .tool{max-height:none}
 #pager{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:10px}
 #pgTxt{font-size:13px;color:var(--muted)}
 .dots{display:flex;gap:10px}
 .dots button{width:12px;height:12px;padding:0;border-radius:50%;background:#fff;border:1.5px solid #000;cursor:pointer}
 .dots button.on{background:#000}
}
</style>
</head>
<body>
<header><div class="head"><img class="logo" src="tiktin-logo.png" alt="טיקטין תכנון חשמל" width="213" height="92"><div class="brand"><h1>אפליקציה ראשית</h1><p>כלי התכנון של משרד טיקטין · <span class="ver">גרסה V10 · 13.11.2026</span></p></div>
<div class="fz" role="group" aria-label="גודל התצוגה" title="שינוי גודל התצוגה של הדף הזה בלבד – הדפדפן לא מושפע">
<button id="fzMinus" title="הקטנה">−</button><button id="fzVal" title="חזרה לגודל רגיל (100%)">100%</button><button id="fzPlus" title="הגדלה">+</button><button id="fzFit" title="הגודל הגדול ביותר שבו כל הכלים נכנסים במסך בלי גלילה">התאמה למסך</button><button id="fzKeep" class="keep" title="שמירת גודל התצוגה של הדף הזה במחשב הזה">שמירת גודל טופס במסך</button>
</div></div></header><div id="fzToast" role="status"></div>
<main><div class="board" id="tools"></div><div id="pager" aria-label="מעבר בין קבוצות"><span id="pgTxt"></span><div class="dots" id="dots"></div></div></main>
<script>
const OWNER='tiktiny', HUB='tiktin-tools';
const initialApps=[
 {repo:'cable-sc',title:'כבלים, הארקה וזרמי קצר',description:'חישוב חתכי כבלים, גידי הארקה, מפל מתח וזרמי קצר.',icon:'cable'},
 {repo:'tiktin-generator-selector',title:'בחירת גנרטור',description:'בחירת גנרטור לפי הספק, מידות, חדר ופתחים.',icon:'generator'},
 {repo:'-tiktin-residential-connection-generator-calculator',title:'קביעת גדלי חיבורים וגנרטורים בבניני מגורים ועירוב שימושים',description:'ריכוז עומסי הפרויקט וקביעת גדלי חיבורי החשמל והגנרטורים.',icon:'building'},
 {repo:'meter-room',title:'תיכנון חדר מונים של חברת חשמל בבניני מגורים',description:'תכנון וסידור חדר המונים בפרויקט מגורים.',icon:'meter'},
 {repo:'ev-charging-boards',title:'חישוב לוחות טעינה וסכמה',description:'גודל חיבורי טעינה לרכבים חשמליים, לוחות טעינה בחניון וסכמה ורטיקלית.',icon:'evcharge'},
 {repo:'residential-guidelines',title:'הכנה אוטומטית של הנחיות חשמל לפרויקט מגורים ועירוב שימושים',description:'הפקת הנחיות חשמל אוטומטיות עבור אדריכל לבנין מגורים ועירוב שימושים, כולל קלט מצגת הפרויקט.',icon:'doc'},
 {repo:'iec-shaft',title:'חישוב רוחב פיר חברת חשמל מונים בקומות',description:'רוחב פיר כבלי חח״י 95 ו־240 לפי מחשבון העומסים, כולל קליטת תמהיל דירות מקובץ.',icon:'shaft'},
 {repo:'iec-transformers',title:'קביעת כמות שנאים חברת חשמל',description:'כמות וגודל שנאי חח״י (630 / 1000) לכל בניין וחלוקה לחדרי שנאים, לפי מחשבון העומסים.',icon:'transformer'},
 {repo:'iec-orders',title:'מסמך פתיחת הזמנות חברת חשמל לפרויקט',description:'הכנת מסמך לפתיחת הזמנות באתר חח״י: לקוח, בניינים ותמהיל, חניון, מסחר וחיבור זמני – Excel ל-SKILL, Word ו-PDF.',icon:'order'},
 {repo:'sii-panel-cert',url:'https://www.sii.org.il/he/certificationssearch?approveType=11&auto=true',title:'בדיקת תו תקן למפעל לוחות – מכון התקנים',description:'קישור לאתר מכון התקנים: חיפוש מפעלי לוחות חשמל בעלי תו תקן.',icon:'cert'},
  {repo:'temp-conn',title:'תכנון חשמל זמני לאתר בנייה',description:'הערכה לפי מבנים, צרכנים, חלוקה ללוחות משנה, סכמה וגודל חיבור זמני מומלץ – מקושר לטופס פתיחת ההזמנות בחברת החשמל.',icon:'tool',img:'temp-conn-icon.png'}
];
const paths={order:'M9 5h14v23H9zM13 3h6v4h-6zM17 11l-4 6h4l-2 5 6-7h-4l2-4',cert:'M16 3l3 3h4v4l3 3-3 3v4h-4l-3 3-3-3H9v-4l-3-3 3-3V6h4zM12 15l3 3 6-6',transformer:'M4 5h24v22H4zM11 10c3 0 3 3 0 3 3 0 3 3 0 3 3 0 3 3 0 3M21 10c-3 0-3 3 0 3-3 0-3 3 0 3-3 0-3 3 0 3M15 9v14M17 9v14',shaft:'M9 3h14v26H9zM13 7v19M17 7v19M21 7v12M9 7h14',cable:'M7 4v20M15 4v20M23 4v20M7 9h16M7 19h16',generator:'M5 9h20v16H5zM9 5h8v4M9 25v3M21 25v3M17 12l-5 7h5l-2 4 7-9h-5',building:'M5 28V5h14v23M19 13h8v15M10 10h4M10 16h4M10 22h4M23 18h1M23 23h1M3 28h26',meter:'M6 4h20v24H6zM10 8h12v9H10zM13 14l3-3 3 2M10 22h3M19 22h3',tool:'M7 5h18v23H7zM12 11h8M12 17h8M12 23h5',doc:'M8 3h11l6 6v20H8zM19 3v6h6M12 14h9M12 18h9M12 22h5M21 21l-2 3h3l-2 3',evcharge:'M2 22v-5l3-6h11l3 6v5zM2 17h17M4.5 22a2.2 2.2 0 1 0 4.4 0M12.5 22a2.2 2.2 0 1 0 4.4 0M24 6h6v6h-6zM25.5 3v3M28.5 3v3M27 12v4h-4v4h-4'};
const GROUPS=[
 {id:'iec',title:'חברת החשמל',sub:'חדר מונים, פיר, שנאים והזמנות',repos:['meter-room','iec-shaft','iec-transformers','iec-orders'],col:0},
 {id:'proj',title:'חיבורים והנחיות לפרויקט',sub:'גדלי חיבורים ומסמך לאדריכל',repos:['-tiktin-residential-connection-generator-calculator','residential-guidelines'],col:1},
 {id:'feed',title:'כבלים, גנרטורים וטעינה',sub:'חישובים ובחירת ציוד',repos:['cable-sc','tiktin-generator-selector','ev-charging-boards'],col:1},
 {id:'site',title:'אתר בנייה ולוחות',sub:'חשמל זמני ותו תקן',repos:['temp-conn','sii-panel-cert'],col:0}];
const board=document.getElementById('tools');
const EXT='<svg class="ext" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 3h4v4M13 3L7 9M11 9v4H3V5h4"/></svg>';
function tool(app){const a=document.createElement('a');a.className='tool';a.href=app.url||`https://${OWNER}.github.io/${encodeURIComponent(app.repo)}/`;a.target='_blank';a.rel='noopener';a.setAttribute('aria-label',app.title+' — פתיחה בלשונית חדשה');
 const ic=app.img?`<span class="icon pic" aria-hidden="true"><img src="${app.img}" alt=""></span>`:`<span class="icon" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="${paths[app.icon]||paths.tool}"/></svg></span>`;
 const t=document.createElement('span');t.className='txt';const h=document.createElement('h3');h.textContent=app.title;const p=document.createElement('p');p.textContent=app.description;t.append(h,p);
 a.innerHTML=ic;a.append(t);a.insertAdjacentHTML('beforeend',EXT);return a}
function render(apps){const by=Object.fromEntries(apps.map(a=>[a.repo,a]));const used=new Set();
 const gs=GROUPS.map(g=>({...g,apps:g.repos.map(r=>by[r]).filter(Boolean)}));gs.forEach(g=>g.apps.forEach(a=>used.add(a.repo)));
 const rest=apps.filter(a=>!used.has(a.repo));if(rest.length){const w=[0,1].map(c=>gs.filter(g=>g.col===c).reduce((s,g)=>s+g.apps.length,0));gs.push({id:'more',title:'כלים נוספים',sub:'',apps:rest,col:w[0]<=w[1]?0:1})}
 board.replaceChildren();const cols=[0,1].map(()=>{const c=document.createElement('div');c.className='col';board.append(c);return c});
 gs.filter(g=>g.apps.length).forEach(g=>{const s=document.createElement('section');s.className='grp';s.style.setProperty('--n',g.apps.length+.6);s.setAttribute('aria-label',g.title);
  s.innerHTML=`<h2>${g.title}${g.sub?`<small>${g.sub}</small>`:''}</h2>`;const bus=document.createElement('div');bus.className='bus';g.apps.forEach(a=>bus.append(tool(a)));s.append(bus);cols[g.col].append(s)});
 // phone pager: one group per page
 const order=[...board.querySelectorAll('.grp')];const dots=document.getElementById('dots');dots.replaceChildren();
 order.forEach((g,k)=>{const d=document.createElement('button');d.type='button';d.setAttribute('aria-label',g.getAttribute('aria-label'));d.onclick=()=>g.scrollIntoView({behavior:'smooth',inline:'start',block:'nearest'});dots.append(d)});mark()}
function mark(){const gs=[...board.querySelectorAll('.grp')];if(!gs.length)return;const i=Math.min(gs.length-1,Math.round(Math.abs(board.scrollLeft)/Math.max(1,board.clientWidth)));
 document.getElementById('pgTxt').textContent=`דף ${i+1} מתוך ${gs.length} – ${gs[i].getAttribute('aria-label')}`;[...document.getElementById('dots').children].forEach((d,k)=>d.classList.toggle('on',k===i))}
board.addEventListener('scroll',()=>requestAnimationFrame(mark),{passive:true});
render(initialApps);
// Automatically discover new public GitHub Pages applications, retaining approved names.
async function refreshApps(){try{const repos=[];for(let page=1;page<=10;page++){const response=await fetch(`https://api.github.com/users/${OWNER}/repos?per_page=100&page=${page}`,{headers:{Accept:'application/vnd.github+json'}});if(!response.ok)return;const batch=await response.json();if(!Array.isArray(batch))return;repos.push(...batch);if(batch.length<100)break}const known=new Set(initialApps.map(a=>a.repo));const extras=repos.filter(r=>r.has_pages&&!r.archived&&r.name!==HUB&&!known.has(r.name)).sort((a,b)=>a.name.localeCompare(b.name)).map(r=>({repo:r.name,title:r.description||r.name.replace(/[-_]/g,' '),description:'כלי נוסף של משרד טיקטין',icon:'tool'}));render([...initialApps,...extras]);}catch{/* The four built-in links remain usable if GitHub cannot be reached. */}}
refreshApps();
// גודל תצוגה (מחשב בלבד): משנה רק את הדף הזה, לא את הדפדפן. נשמר רק בלחיצה על "שמירת גודל טופס במסך"
(function(){const KEY='tiktin_tools_zoom',MIN=0.8,MAX=2,STEP=0.1,$=id=>document.getElementById(id),desk=matchMedia('(min-width:700px)');let z=1;
 try{const s=parseFloat(localStorage.getItem(KEY));if(s>=MIN&&s<=MAX)z=s}catch(e){}
 const toast=t=>{const el=$('fzToast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2200)};
 function set(v){const b=document.body.style;if(!desk.matches){b.zoom='';b.minHeight='';return}b.zoom=v;b.minHeight=(100/v)+'dvh'}
 // נכנס במסך = אין גלילה בדף, ואף קבוצה או כלי לא נחתכים או עולים זה על זה
 const fits=()=>document.documentElement.scrollHeight<=innerHeight+1&&document.documentElement.scrollWidth<=innerWidth+1&&[...document.querySelectorAll('.grp,.bus,.tool')].every(e=>e.scrollHeight<=e.clientHeight+1);
 function apply(){z=Math.round(Math.min(MAX,Math.max(MIN,z))*100)/100;const c=document.body.classList;c.remove('zoomed');set(z);
  if(desk.matches&&!fits())c.add('zoomed');   // גדול מהמסך: הכלים בגובה מלא והדף נגלל, במקום שיידחסו זה על זה
  $('fzVal').textContent=Math.round(z*100)+'%'}
 $('fzMinus').onclick=()=>{z-=STEP;apply()};$('fzPlus').onclick=()=>{z+=STEP;apply()};$('fzVal').onclick=()=>{z=1;apply()};
 $('fzFit').onclick=()=>{document.body.classList.remove('zoomed');let v=MAX;for(;v>MIN;v=Math.round((v-0.05)*100)/100){set(v);if(fits())break}z=v;apply()};
 $('fzKeep').onclick=()=>{try{localStorage.setItem(KEY,z);toast('גודל התצוגה נשמר במחשב הזה: '+Math.round(z*100)+'%')}catch(e){toast('לא ניתן לשמור במחשב הזה')}};
 desk.addEventListener('change',apply);addEventListener('resize',()=>{clearTimeout(apply.t);apply.t=setTimeout(apply,150)});
 new MutationObserver(apply).observe(board,{childList:true});apply()})();
</script>
</body></html>
